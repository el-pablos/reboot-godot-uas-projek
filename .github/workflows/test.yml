# =============================================================================
# CI — Headless Test Suite untuk Project: REBOOT
# =============================================================================
# Trigger: push/PR ke master atau fix/* branches
# Jalankan 119 unit tests via TestRunner headless, exit code = jumlah fail
# =============================================================================

name: "🧪 Headless Tests"

on:
  push:
    branches: [master, "fix/*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: "Run Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🤖 Setup Godot 4.6"
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0-stable
          use-dotnet: false
          include-templates: false

      - name: "📦 Import project resources"
        run: |
          godot --headless --import --quit 2>&1 || true
          echo "Import complete"

      - name: "🔧 Swap main scene ke TestRunner"
        run: |
          # Backup project.godot
          cp project.godot project.godot.bak
          # Swap main_scene ke TestRunner
          sed -i 's|run/main_scene="res://scenes/main_menu/MainMenu.tscn"|run/main_scene="res://test/TestRunner.tscn"|' project.godot
          echo "Main scene swapped to TestRunner"
          grep "main_scene" project.godot

      - name: "🧪 Run headless tests"
        id: tests
        run: |
          set +e
          godot --headless --path . 2>&1 | tee test_output.log
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo ""
          echo "================================"
          echo "Test exit code: $EXIT_CODE"
          echo "================================"
          exit $EXIT_CODE

      - name: "🔄 Restore main scene"
        if: always()
        run: |
          mv project.godot.bak project.godot
          echo "Main scene restored"

      - name: "📋 Upload test log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test_output.log
          retention-days: 14
